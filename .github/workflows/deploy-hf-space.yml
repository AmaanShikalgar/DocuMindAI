# Mirrors master to the Hugging Face Space, which builds and runs the Dockerfile.
# Needs a repo secret HF_TOKEN (a Hugging Face write token) and a repo variable HF_SPACE
# (e.g. "your-hf-username/documind").
name: Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.25"
      - name: Stage the Space
        run: |
          mkdir -p "$RUNNER_TEMP/space"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/space"
          cp deploy/hf-space/README.md "$RUNNER_TEMP/space/README.md"
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*"],  # mirror: remove files deleted from the repo
          )
          PY
